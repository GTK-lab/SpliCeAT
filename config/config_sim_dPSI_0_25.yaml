name: config

pipeline_dir: "/mnt/cbis/home/e1156796/final_IRF/SpliCeAT" #path to SpliCeAT directory
results_dir: "/mnt/gtklab01/e1156796/final_sim_run_IRF/dPSI_0_25" #path to results directory

ref:
  species: "Homo_sapiens" #Homo_sapiens
  build: "GRCh38" #GRCh38
  ensembl_release: 115
  flavor: "chr" #check ensembl for other options

samples: "design_sim_dPSI_0_25.tsv"

experiment:
  name: "final_sim_run_dPSI_0_25"
  biotype: "protein_coding"
  max_transcript_support_level: 3
  strandedness: "forward" # forward, reverse or none
  readlen: 100
  groups: [ "control", "treated" ]
  event_overlap: True #false for gene-level, true for event-level

STAR:
  activate: False
  threads: 16
  index_extra: ""
  align_extra: "--twopassMode Basic"

bgzip:
  threads: 4

leafcutter:
  activate: True
  max_intron_length: 500000
  min_samples_per_group: 2
  cluster_support_min: 50

majiq:
  activate: True
  license: "/mnt/cbis/home/e1156796/final_IRF/SpliCeAT_add/majiq_license_academic_official.lic"
  build_extra: ""

whippet:
  activate: True
  bam_groups: [ "control", "treated" ]
  bam_min_reads: 20

irfinder:
  activate: True
  cnn_validation: True
  min_irratio: 0.05
  warning_level: 1
  padj: 0.05
  min_delta_irratio: 0.2

stringtie:
  activate: True
  threads: 4
  min_juncs: 20

kallisto:
  bootstraps: 100
  threads: 4
